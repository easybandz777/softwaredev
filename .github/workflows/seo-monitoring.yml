name: Weekly SEO Monitoring

# Runs every Sunday 11:00 UTC (~06:00 ET / ~03:00 PT) and on manual dispatch.
# Generates the full monitoring sweep, commits the new dated reports back to
# the repo, and opens (or updates) a GitHub issue with the weekly summary.
#
# Required secrets (all optional — script degrades gracefully if missing):
#   GSC_SERVICE_ACCOUNT_JSON_B64   base64-encoded GSC service-account JSON
#                                  (see seo-deliverables/monitoring/SETUP-GSC-API.md)
#   SERPAPI_KEY                    serpapi.com API key for rank tracking
#   DATAFORSEO_LOGIN               alternative to SerpApi
#   DATAFORSEO_PASSWORD            alternative to SerpApi
#
# Permissions: contents:write to commit reports, issues:write to file the issue.

on:
  schedule:
    - cron: "0 11 * * 0"  # Sunday 11:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: seo-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKIP_LIGHTHOUSE: "1"  # Lighthouse + headless Chrome is slow in CI; run locally weekly
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
      DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
      # GH CLI needs this for `gh issue` calls
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Decode GSC service-account JSON (if provided)
        if: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON_B64 != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/gsc"
          echo "${{ secrets.GSC_SERVICE_ACCOUNT_JSON_B64 }}" | base64 -d > "$RUNNER_TEMP/gsc/key.json"
          chmod 600 "$RUNNER_TEMP/gsc/key.json"
          echo "GSC_SERVICE_ACCOUNT_JSON=$RUNNER_TEMP/gsc/key.json" >> "$GITHUB_ENV"

      - name: Run all monitors
        id: monitor
        run: |
          set +e
          bash scripts/run-all-audits.sh
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          # Locate today's reports
          DATE=$(date +%Y-%m-%d)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "weekly_report=seo-deliverables/monitoring/weekly-report-$DATE.md" >> "$GITHUB_OUTPUT"
          echo "rollup_report=seo-deliverables/monitoring/00-WEEKLY-REPORT-$DATE.md" >> "$GITHUB_OUTPUT"

      - name: Stage and commit new reports
        run: |
          DATE=${{ steps.monitor.outputs.date }}
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-deliverables/monitoring/ || true
          if git diff --cached --quiet; then
            echo "No new monitoring files to commit."
          else
            git commit -m "chore(seo): weekly monitoring snapshot $DATE [skip ci]" || true
            git push || true
          fi

      - name: Open / update weekly issue
        if: always()
        env:
          DATE: ${{ steps.monitor.outputs.date }}
          WEEKLY_REPORT: ${{ steps.monitor.outputs.weekly_report }}
          ROLLUP_REPORT: ${{ steps.monitor.outputs.rollup_report }}
          MONITOR_EXIT: ${{ steps.monitor.outputs.exitcode }}
        run: |
          set -e
          TITLE="SEO weekly monitoring — $DATE"
          BODY_FILE="$RUNNER_TEMP/issue-body.md"
          {
            echo "Auto-generated by \`.github/workflows/seo-monitoring.yml\`."
            echo
            echo "Run exit code from orchestrator: \`$MONITOR_EXIT\` (0 = all monitors completed)."
            echo
            echo "## One-pager summary"
            echo
            if [ -f "$WEEKLY_REPORT" ]; then
              cat "$WEEKLY_REPORT"
            else
              echo "_weekly-report-$DATE.md not generated — orchestrator likely failed before the aggregator step. See log artifact._"
            fi
            echo
            echo "---"
            echo
            echo "Full rollup: [\`$ROLLUP_REPORT\`]($ROLLUP_REPORT)"
            echo "All dated reports: [seo-deliverables/monitoring/](seo-deliverables/monitoring/)"
          } > "$BODY_FILE"

          # If an issue with the exact title already exists, append a comment.
          # Else, create a new one.
          EXISTING=$(gh issue list --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create \
              --title "$TITLE" \
              --label "seo,monitoring" \
              --body-file "$BODY_FILE" || \
            gh issue create \
              --title "$TITLE" \
              --body-file "$BODY_FILE"
          fi

      - name: Upload raw monitoring artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-monitoring-${{ steps.monitor.outputs.date }}
          path: |
            seo-deliverables/monitoring/*.md
            seo-deliverables/monitoring/*.json
            seo-deliverables/monitoring/*.csv
            seo-deliverables/monitoring/*.tsv
            seo-deliverables/monitoring/*.log
          retention-days: 90
          if-no-files-found: warn
